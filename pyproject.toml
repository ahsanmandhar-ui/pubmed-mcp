[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pubmed-mcp"
version = "0.1.0"
description = "A minimal, auditable Model Context Protocol (MCP) server for PubMed via NCBI E-utilities with open-access detection."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "ahsanmandhar-ui" }
]
keywords = ["mcp", "pubmed", "ncbi", "open-access", "model-context-protocol", "ai", "research"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "mcp>=1.2.0,<3",
    "requests>=2.31.0",
]

[project.scripts]
pubmed-mcp = "server:main"

[project.urls]
Homepage = "https://github.com/ahsanmandhar-ui/pubmed-mcp"
Repository = "https://github.com/ahsanmandhar-ui/pubmed-mcp"
Issues = "https://github.com/ahsanmandhar-ui/pubmed-mcp/issues"

[tool.setuptools]
py-modules = ["server", "access"]
