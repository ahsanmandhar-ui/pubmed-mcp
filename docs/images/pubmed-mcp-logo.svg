<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#0d9488" stroke="#0f766e" stroke-width="4"/>
  
  <!-- Inner white circle -->
  <circle cx="100" cy="100" r="78" fill="#f0fdfa"/>
  
  <!-- Stylized document / paper -->
  <rect x="62" y="48" width="76" height="100" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  
  <!-- Lines on the paper (abstract lines) -->
  <line x1="74" y1="68" x2="126" y2="68" stroke="#0d9488" stroke-width="4" stroke-linecap="round"/>
  <line x1="74" y1="84" x2="118" y2="84" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="74" y1="100" x2="126" y2="100" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="74" y1="116" x2="110" y2="116" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Small "P" badge / provenance mark -->
  <circle cx="128" cy="138" r="22" fill="#0d9488"/>
  <text x="128" y="146" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">P</text>
  
  <!-- Tiny check mark for "auditable" -->
  <path d="M 118 136 L 125 144 L 140 128" fill="none" stroke="#f0fdfa" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>